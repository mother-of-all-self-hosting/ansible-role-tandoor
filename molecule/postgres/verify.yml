---
- name: Verify Tandoor systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for Tandoor service to become active (up to 180s)
      ansible.builtin.systemd:
        name: tandoor.service
      register: tandoor_service
      until: tandoor_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Tandoor service is active
      ansible.builtin.assert:
        that: tandoor_service.status.ActiveState == 'active'
        fail_msg: "tandoor.service not active ({{ tandoor_service.status.ActiveState }})"
        success_msg: "tandoor.service is active"

    - name: Retrieve Tandoor service log for debugging
      when: tandoor_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu tandoor.service
      changed_when: false

    - name: Wait for Tandoor HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:80/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: tandoor_endpoint
      until: tandoor_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert Tandoor HTTP endpoint responds
      ansible.builtin.assert:
        that: tandoor_endpoint.status in [200, 302]
        fail_msg: "Tandoor did not respond as expected ({{ tandoor_endpoint.status | default('no response') }})"
        success_msg: "Tandoor responded with {{ tandoor_endpoint.status }}"

    - name: Show Tandoor systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Tandoor systemd: {{ tandoor_service.status.ActiveState }}"
          - "Tandoor HTTP: {{ tandoor_endpoint.status }}"
